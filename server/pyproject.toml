[project]
name = "vocab-server"
version = "0.1.0"
description = "词表分发 + 学习进度同步服务"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.43",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "alembic>=1.18",
    "python-multipart>=0.0.20",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
]

[tool.uv]
package = false
